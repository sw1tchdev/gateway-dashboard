name: Gateway static release

on:
  push:
    tags: ["gateway-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm lint && pnpm lint:css && pnpm test
      - run: pnpm build
      - name: Package static files
        run: |
          cd dist
          jq --arg rev "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" '. + {revision: $rev, tag: $tag}' build-info.json > metadata.tmp
          mv metadata.tmp build-info.json
          zip -qr ../dashboard.zip .
          cd ..
          sha256sum dashboard.zip > dashboard.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: static-dashboard
          path: |
            dashboard.zip
            dashboard.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-dashboard
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check dashboard.zip.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" dashboard.zip dashboard.zip.sha256
